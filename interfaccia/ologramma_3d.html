<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS — Holographic 3D Model</title>
<style>
:root{color-scheme:dark;--cyan:#48fff2;--green:#7dff9d}
*{box-sizing:border-box}
body{margin:0;background:#02080e;color:#d7ffff;font:13px Consolas,Monaco,monospace;overflow:hidden}
header{position:absolute;z-index:2;left:18px;top:14px;right:18px;display:flex;justify-content:space-between;gap:16px;align-items:center;text-transform:uppercase;letter-spacing:.12em;color:var(--cyan)}
header strong{font-size:16px}
#cameraState{color:var(--green);font-size:11px;text-align:right}
#trackingError{display:none;max-width:340px;overflow-wrap:anywhere;color:#ffb08f;font-size:11px;margin-top:6px;white-space:normal}
#scene{width:100vw;height:100vh;display:block}
.panel{position:absolute;z-index:2;left:18px;bottom:18px;max-width:360px;padding:12px 14px;border:1px solid #1b8994;background:#03121ddd;line-height:1.7}
button{background:#05212a;border:1px solid var(--cyan);color:#d7ffff;padding:7px 10px;margin:3px;font:inherit;cursor:pointer}
button:hover,button:focus{background:#0a3b43;outline:1px solid var(--green)}
small{color:#70aeb8}
</style>
</head>
<body>
<header><strong>J.A.R.V.I.S. // 3D HOLOGRAM</strong><span id="state">MODEL: X-01 • INTERACTIVE</span><span id="cameraState">CAMERA: IN ATTESA</span></header>
<canvas id="scene" aria-label="Modello tridimensionale wireframe di un'automobile"></canvas>
<div class="panel">
  <div>MODEL X-01 // WIREFRAME</div>
  <div><button id="explode">ESPLODI COMPONENTI</button><button id="reset">RESET VISTA</button></div>
  <small>Webcam attivata all’apertura · mano aperta per rilevamento · scorri per ruotare · due mani per zoom · pizzico per separare i componenti</small>
  <div id="readout">ZOOM 100% // COMPONENTI UNITI</div>
  <div id="trackingError" role="status" aria-live="polite"></div>
</div>
<video id="handCamera" playsinline muted style="display:none"></video>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils@0.3.1675466862/camera_utils.js"></script>
<script>
(() => {
  "use strict";
  const canvas = document.getElementById("scene");
  const ctx = canvas.getContext("2d");
  const readout = document.getElementById("readout");
  let yaw = -0.55, pitch = -0.18, zoom = 1, exploded = false;
  let dragging = false, lastX = 0, lastY = 0;
  const parts = [];
  function box(name, center, size, color, offsetFn) {
    const [x,y,z] = center, [w,h,d] = size;
    const v = [
      [-w/2,-h/2,-d/2],[w/2,-h/2,-d/2],[w/2,h/2,-d/2],[-w/2,h/2,-d/2],
      [-w/2,-h/2,d/2],[w/2,-h/2,d/2],[w/2,h/2,d/2],[-w/2,h/2,d/2]
    ].map(p=>[p[0]+x,p[1]+y,p[2]+z]);
    const e = [[0,1],[1,2],[2,3],[3,0],[4,5],[5,6],[6,7],[7,4],[0,4],[1,5],[2,6],[3,7]];
    parts.push({name,vertices:v,edges:e,color,offsetFn});
  }
  function wheel(name, x, y, z, radius, color, offsetFn) {
    const vertices=[], edges=[], n=16;
    for(let i=0;i<n;i++){
      const a=i*Math.PI*2/n;
      vertices.push([x,y+Math.cos(a)*radius,z+Math.sin(a)*radius]);
      edges.push([i,(i+1)%n]);
    }
    parts.push({name,vertices,edges,color,offsetFn});
  }
  const bodyOffset = () => [0,0,0];
  const cabinOffset = () => [0, exploded ? .48 : 0, 0];
  const wheelOffset = (side, front) => [side*(exploded ? 0.58 : 0), exploded ? 0.12 : 0, front*(exploded ? 0.42 : 0)];
  box("chassis",[0,.48,0],[1.85,.45,3.25],"#48fff2",bodyOffset);
  box("cabin",[0,.94,-.15],[1.35,.62,1.55],"#7dff9d",cabinOffset);
  box("front",[0,.58,1.72],[1.55,.25,.25],"#48fff2",bodyOffset);
  box("rear",[0,.58,-1.72],[1.55,.25,.25],"#48fff2",bodyOffset);
  for(const side of [-1,1]) for(const front of [-1,1]){
    const x=side*.96, z=front*1.08;
    wheel("wheel",x,.34,z,.34,"#7dff9d",()=>wheelOffset(side,front));
    wheel("rim",x+side*.012,.34,z,.17,"#48fff2",()=>wheelOffset(side,front));
  }
  function project(point) {
    let [x,y,z]=point;
    const cy=Math.cos(yaw), sy=Math.sin(yaw);
    [x,z]=[x*cy-z*sy,x*sy+z*cy];
    const cp=Math.cos(pitch), sp=Math.sin(pitch);
    [y,z]=[y*cp-z*sp,y*sp+z*cp];
    const scale=Math.min(canvas.clientWidth,canvas.clientHeight)*.23*zoom;
    const depth=7+z;
    return [canvas.clientWidth/2+x*scale*7/depth,canvas.clientHeight*.53-y*scale*7/depth,depth];
  }
  function resize() {
    const dpr=Math.min(window.devicePixelRatio||1,2);
    canvas.width=Math.floor(innerWidth*dpr);
    canvas.height=Math.floor(innerHeight*dpr);
    canvas.style.width=innerWidth+"px";canvas.style.height=innerHeight+"px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
  }
  function draw() {
    const w=innerWidth,h=innerHeight;
    ctx.clearRect(0,0,w,h);
    ctx.strokeStyle="#09212d";ctx.lineWidth=1;
    for(let x=0;x<w;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,h);ctx.stroke()}
    for(let y=0;y<h;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(w,y);ctx.stroke()}
    // Subtle projected floor ellipse
    ctx.beginPath();ctx.ellipse(w/2,h*.78,Math.min(w,h)*.28,Math.min(w,h)*.07,0,0,Math.PI*2);
    ctx.strokeStyle="#0a5360";ctx.stroke();
    for(const part of parts){
      const offset=part.offsetFn?part.offsetFn():[0,0,0];
      const pts=part.vertices.map(v=>project([v[0]+offset[0],v[1]+offset[1],v[2]+offset[2]]));
      ctx.beginPath();
      for(const [a,b] of part.edges){ctx.moveTo(pts[a][0],pts[a][1]);ctx.lineTo(pts[b][0],pts[b][1])}
      ctx.strokeStyle=part.color;ctx.lineWidth=1.35;ctx.shadowBlur=7;ctx.shadowColor=part.color;ctx.stroke();ctx.shadowBlur=0;
    }
    ctx.fillStyle="#48fff2";ctx.font="11px Consolas, monospace";
    ctx.fillText("OPTICAL TRACKING: READY",w-205,h-22);
    readout.textContent="ZOOM "+Math.round(zoom*100)+"% // "+(exploded?"COMPONENTI SEPARATI":"COMPONENTI UNITI");
    requestAnimationFrame(draw);
  }
  canvas.addEventListener("pointerdown",e=>{dragging=true;lastX=e.clientX;lastY=e.clientY;canvas.setPointerCapture(e.pointerId)});
  canvas.addEventListener("pointermove",e=>{if(!dragging)return;yaw+=(e.clientX-lastX)*.009;pitch=Math.max(-1.05,Math.min(.7,pitch+(e.clientY-lastY)*.009));lastX=e.clientX;lastY=e.clientY});
  canvas.addEventListener("pointerup",()=>dragging=false);
  canvas.addEventListener("pointercancel",()=>dragging=false);
  canvas.addEventListener("wheel",e=>{e.preventDefault();zoom=Math.max(.55,Math.min(1.8,zoom*(e.deltaY<0?1.06:.94)))},{passive:false});
  document.getElementById("explode").addEventListener("click",()=>{exploded=!exploded;document.getElementById("state").textContent=exploded?"MODEL: X-01 • EXPLODED VIEW":"MODEL: X-01 • INTERACTIVE"});
  document.getElementById("reset").addEventListener("click",()=>{yaw=-.55;pitch=-.18;zoom=1;exploded=false;document.getElementById("state").textContent="MODEL: X-01 • INTERACTIVE"});
  const cameraState = document.getElementById("cameraState");
  const video = document.getElementById("handCamera");
  let handsTracker = null, cameraStream = null;
  let previousWristX = null, previousTwoHands = null, movementAccum = 0;
  let lastRotate = 0, lastZoom = 0, lastPinch = 0, pinchHeld = false;

  function distance2D(a,b){ return Math.hypot(a.x-b.x,a.y-b.y); }
  function setCameraStatus(message, color, details="") {
    cameraState.textContent = message;
    cameraState.style.color = color;
    cameraState.title = details;
    const errorBox = document.getElementById("trackingError");
    const hasError = /ERRORE|NEGATO|NON SUPPORTATA|LIBRERIE/i.test(message);
    errorBox.style.display = hasError && details ? "block" : "none";
    errorBox.textContent = hasError && details ? "Dettaglio: " + details : "";
  }
  function handleHandResults(results) {
    const found = results.multiHandLandmarks || [];
    const now = performance.now();
    if (!found.length) {
      previousWristX = null;
      previousTwoHands = null;
      movementAccum = 0;
      pinchHeld = false;
      setCameraStatus("CAMERA: ATTIVA • MANO NON RILEVATA", "#ffcf70",
        "Tieni la mano aperta davanti alla webcam, ben illuminata e interamente visibile.");
      return;
    }
    setCameraStatus("TRACCIAMENTO: " + found.length + (found.length === 1 ? " MANO" : " MANI"),
      "#7dff9d", "Mani riconosciute: " + found.length + ". Muovi la mano lateralmente per ruotare.");
    const first = found[0];
    const pinchDistance = distance2D(first[4], first[8]);
    if (pinchDistance < 0.045 && !pinchHeld && now-lastPinch > 800) {
      exploded = !exploded;
      lastPinch = now;
      pinchHeld = true;
      document.getElementById("state").textContent = exploded ? "MODEL: X-01 • EXPLODED VIEW" : "MODEL: X-01 • INTERACTIVE";
    } else if (pinchDistance > 0.075) {
      pinchHeld = false;
    }

    if (found.length >= 2) {
      const separation = distance2D(found[0][0], found[1][0]);
      if (previousTwoHands === null) previousTwoHands = separation;
      const delta = separation - previousTwoHands;
      if (now-lastZoom > 250 && delta > 0.025) {
        zoom = Math.min(1.8, zoom*1.07);
        lastZoom = now;
        previousTwoHands = separation;
      } else if (now-lastZoom > 250 && delta < -0.025) {
        zoom = Math.max(0.55, zoom*0.93);
        lastZoom = now;
        previousTwoHands = separation;
      }
      previousWristX = null;
      movementAccum = 0;
    } else {
      previousTwoHands = null;
      const wristX = first[0].x;
      if (previousWristX !== null) movementAccum += wristX - previousWristX;
      previousWristX = wristX;
      if (now-lastRotate > 180 && movementAccum > 0.035) {
        yaw += 0.28;
        lastRotate = now;
        movementAccum = 0;
      } else if (now-lastRotate > 180 && movementAccum < -0.035) {
        yaw -= 0.28;
        lastRotate = now;
        movementAccum = 0;
      }
    }
  }

  async function startHandCamera() {
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
      setCameraStatus("CAMERA: NON SUPPORTATA", "#ff9b73", "Apri il viewer da http://127.0.0.1 per usare la webcam.");
      return;
    }
    if (typeof window.Hands !== "function" || typeof window.Camera !== "function") {
      setCameraStatus("CAMERA: ERRORE LIBRERIE", "#ff9b73", "Serve una connessione Internet per caricare il tracciamento delle mani.");
      return;
    }
    try {
      setCameraStatus("CAMERA: RICHIESTA PERMESSO...", "#48fff2");
      // Evita il pacchetto SIMD: su alcune versioni di Chrome/macOS il suo
      // percorso WebGL fallisce con GLctx.createTexture undefined.
      handsTracker = new window.Hands({
        locateFile: file => {
          const base = "https://cdn.jsdelivr.net/npm/@mediapipe/hands@0.4.1675469240/";
          return base + file.replace(/hands_solution_simd_wasm_bin/g, "hands_solution_wasm_bin");
        }
      });
      handsTracker.setOptions({
        maxNumHands: 2,
        modelComplexity: 0,
        minDetectionConfidence: 0.65,
        minTrackingConfidence: 0.55
      });
      handsTracker.onResults(handleHandResults);
      cameraStream = new window.Camera(video, {
        onFrame: async () => {
          // MediaPipe può essere chiamato prima che il video abbia un frame valido.
          if (!video || video.readyState < HTMLMediaElement.HAVE_CURRENT_DATA ||
              !video.videoWidth || !video.videoHeight || !handsTracker) return;
          try {
            await handsTracker.send({image: video});
          } catch (error) {
            const detail = String(error && (error.stack || error.message) || error);
            setCameraStatus("ERRORE RICONOSCIMENTO", "#ff9b73", detail.slice(0, 700));
          }
        },
        width: 640,
        height: 480
      });
      await cameraStream.start();
      setCameraStatus("CAMERA: ATTIVA • CERCO LA MANO", "#48fff2",
        "Consenti la webcam e tieni una mano aperta davanti alla fotocamera. Elaborazione locale, senza registrazione.");
    } catch (error) {
      setCameraStatus("CAMERA: ACCESSO NEGATO", "#ff9b73", String(error && error.message || error));
    }
  }

  window.addEventListener("beforeunload", () => {
    try { if (cameraStream && cameraStream.stop) cameraStream.stop(); } catch (_) {}
    try {
      const stream = video.srcObject;
      if (stream && stream.getTracks) stream.getTracks().forEach(track => track.stop());
    } catch (_) {}
    try { if (handsTracker && handsTracker.close) handsTracker.close(); } catch (_) {}
  });
  startHandCamera();
  window.addEventListener("resize",resize);resize();draw();
})();
</script>
</body>
</html>
