name: Jarvis CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify dependencies
        run: python -m pip check
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Verify no legacy version references
        run: |
          python - <<'PY'
          import os
          import re

          pattern = re.compile(r"(?<![0-9])(3\.1|3\.0|4\.0)(?![0-9])")
          excluded_dirs = {".git", ".github", "venv", "__pycache__"}
          excluded_extensions = {".json", ".pyc"}
          found = []

          for root, dirs, files in os.walk("."):
              dirs[:] = [d for d in dirs if d not in excluded_dirs]
              for filename in files:
                  if os.path.splitext(filename)[1].lower() in excluded_extensions:
                      continue
                  path = os.path.join(root, filename)
                  try:
                      with open(path, "r", encoding="utf-8") as file:
                          for line_number, line in enumerate(file, 1):
                              if pattern.search(line):
                                  found.append(f"{path}:{line_number}:{line.rstrip()}")
                  except (UnicodeDecodeError, OSError):
                      continue

          if found:
              print("Trovati riferimenti a versioni legacy:")
              print("\n".join(found))
              raise SystemExit(1)
          print("Nessun riferimento legacy trovato.")
          PY
      - name: Run tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
